name: Bug report
description: A rule reports a false positive/negative, or a code fix produces wrong code
labels: [bug]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: FRE0001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fretje.Analyzers version
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that reproduces the problem
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: IDE and version, `dotnet --version`
